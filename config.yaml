database:
  echo: false
  enabled: true
  pool_size: 10
  url: mysql+pymysql://root:keshuzhineng@127.0.0.1:6669/ksom
kb:
  chunk_overlap: 50
  chunk_size: 300
  collection_name: safety_regulations
  device: cuda:0
  embedding_model_path: /mnt/data/clip/LangGraph/VLLM/BGE-M3
  qdrant_host: localhost
  qdrant_port: 6333
  reranker_model_path: /mnt/data/clip/LangGraph/VLLM/bge-reranker-v2-m3
  source_dir: /mnt/data/clip/LangGraph/agent/data/kb_sources
  upload_dir: /mnt/data/clip/LangGraph/agent/data/kb_uploads
llm:
  api_key: EMPTY
  base_url: http://127.0.0.1:8004/v1
  guided_json_enabled: true
  max_tokens: 2048
  model: Qwen3-VL-4B-Instruct-FP8
  temperature: 0.2
  timeout: 60
logging:
  format: '<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level>
    | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>'
  level: INFO
mcp:
  enabled: true
  endpoint: http://127.0.0.1:6620/mcp
  om_base_url: http://127.0.0.1:6611
  retry:
    backoff_base: 0.5
    backoff_max: 4.0
    max_attempts: 3
  reconnect:
    interval: 10               # 首次重试间隔（秒）
    max_interval: 60           # 退避上限（秒）
    health_interval: 30        # 已连接时的健康检查间隔（秒）
    connect_timeout: 10        # 单次连接尝试超时（秒）

# 知识库（MySQL 元数据 + Qdrant 向量，由 KSAgent 统一管理）
kb:
  qdrant_host: "localhost"
  qdrant_port: 6333
  collection_name: "safety_regulations"
  upload_dir: "/var/lib/ksom/var/lib/LangGraph/agent/data/kb_uploads"
  source_dir: "/var/lib/ksom/var/lib/LangGraph/agent/data/kb_sources"
  embedding_model_path: "/var/lib/ksom/var/lib/LangGraph/VLLM/BGE-M3"
  reranker_model_path: "/var/lib/ksom/var/lib/LangGraph/VLLM/bge-reranker-v2-m3"
  device: "cuda:0"
  chunk_size: 300
  chunk_overlap: 50
  # 旧版 .doc 解析用 NLTK 数据离线目录（可选；未设置则尝试 ~/nltk_data 或联网下载）
  # nltk_data_dir: "/var/lib/ksom/var/lib/LangGraph/agent/data/nltk_data"

# RAG 知识库（对话检索开关，阶段 3 接入）
rag:
  dataset_id: safety_regulations
  enabled: false
  ragflow_url: http://ragflow.internal:8080
  top_k: 3
redis:
  addr: 192.168.1.90:6731
  db: 0
  enabled: true
  key_prefix: 'ksagent:memory:'
  password: ''
  ttl: 2592000
server:
  host: 0.0.0.0
  log_level: info
  port: 8001
  reload: false
